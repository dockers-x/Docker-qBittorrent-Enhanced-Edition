name: Update and publish

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      check_upstream:
        description: Check upstream first (disable to rebuild ReleaseTag)
        type: boolean
        default: true
  push:
    branches: [master]
    paths:
      - ReleaseTag
      - Dockerfile
      - install.sh
      - docker-entrypoint.sh
      - configure-webui.py
      - root/**
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Select version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CHECK_UPSTREAM: ${{ inputs.check_upstream }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat ReleaseTag)
          if [[ "$EVENT_NAME" == schedule || "$CHECK_UPSTREAM" == true ]]; then
            upstream_tag=$(gh api repos/c0re100/qBittorrent-Enhanced-Edition/releases/latest --jq .tag_name)
            [[ "$upstream_tag" == release-* ]] || { echo 'Unexpected upstream tag' >&2; exit 1; }
            version=${upstream_tag#release-}
          fi
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || { echo 'Invalid ReleaseTag' >&2; exit 1; }
          printf '%s\n' "$version" > ReleaseTag
          if ! git diff --quiet -- ReleaseTag; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add ReleaseTag
            git commit -m "Update upstream to $version"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
          build=true
          if [[ "$EVENT_NAME" == schedule ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
            if jq -e --arg version "$version" 'any(.[]; .tag_name == $version and .draft == false)' "$RUNNER_TEMP/releases.json" > /dev/null; then
              build=false
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Version: $version; build: $build"

  publish:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          username: czyt
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            czyt/qbittorrentee:${{ needs.prepare.outputs.version }}
            czyt/qbittorrentee:${{ needs.prepare.outputs.version }}-r1
            czyt/qbittorrentee:latest
            czyt/qbittorrentee:sha-${{ needs.prepare.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify WebUI login and runtime identity
        id: smoke
        continue-on-error: true
        env:
          IMAGE: czyt/qbittorrentee:sha-${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          cleanup() {
            for mode in default custom root; do
              docker rm --force --volumes "qbittorrent-smoke-$mode" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT
          for mode in default custom root; do
            args=()
            expected_uid=1000
            if [[ "$mode" != default ]]; then
              args+=(--env WEBUI_USERNAME=smoke-admin --env WEBUI_PASSWORD=smoke-password)
            fi
            if [[ "$mode" == root ]]; then
              args+=(--env RUN_AS_ROOT=true --env ENABLE_CONFIG_PERM_FIX=false --env ENABLE_DOWNLOADS_PERM_FIX=false)
              expected_uid=0
            fi
            container="qbittorrent-smoke-$mode"
            docker run --detach --network none --name "$container" "${args[@]}" "$IMAGE"
            if ! docker exec -i "$container" python3 - <<'PY'
          import os
          import http.cookiejar
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          credentials = urllib.parse.urlencode({
              "username": os.environ.get("WEBUI_USERNAME", "admin"),
              "password": os.environ.get("WEBUI_PASSWORD", "adminadmin"),
          }).encode()
          cookies = http.cookiejar.CookieJar()
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookies))
          for attempt in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8080/api/v2/app/version", timeout=2) as response:
                      raise SystemExit("Unauthenticated API access succeeded; authentication must be enabled")
              except urllib.error.HTTPError as error:
                  if error.code in (401, 403):
                      break
                  if error.code != 503:
                      raise
              except (urllib.error.URLError, TimeoutError):
                  pass
              time.sleep(1)
          else:
              raise SystemExit("Protected WebUI API did not become ready")
          for attempt in range(60):
              try:
                  with client.open("http://127.0.0.1:8080/api/v2/auth/login", data=credentials, timeout=2) as response:
                      body = response.read()
                      session_names = {"SID", "QBT_SID_" + os.environ.get("WEBUIPORT", "8080")}
                      has_session = any(cookie.name in session_names for cookie in cookies)
                      if response.status == 202 and not has_session:
                          time.sleep(1)
                          continue
                      assert 200 <= response.status < 300 and has_session, f"Login failed: HTTP {response.status}, body={body!r}"
                      print(f"Login established a session: HTTP {response.status}")
                      break
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"WebUI rejected configured credentials: HTTP {error.code}") from error
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(1)
          else:
              raise SystemExit("WebUI did not become ready")
          with client.open("http://127.0.0.1:8080/api/v2/app/version", timeout=2) as response:
              assert 200 <= response.status < 300 and response.read().strip(), "Authenticated API access failed"
          wrong_credentials = urllib.parse.urlencode({"username": "invalid-user", "password": "invalid-password"}).encode()
          try:
              with urllib.request.urlopen("http://127.0.0.1:8080/api/v2/auth/login", data=wrong_credentials, timeout=2) as response:
                  assert response.read() == b"Fails.", "Invalid credentials were not rejected"
          except urllib.error.HTTPError as error:
              assert error.code in (401, 403), f"Unexpected failed-login status: {error.code}"
          PY
            then
              docker logs "$container"
              exit 1
            fi
            actual_uid=$(docker exec "$container" python3 -c 'from pathlib import Path; print(next(line.split()[1] for path in Path("/proc").glob("[0-9]*/status") if path.parent.joinpath("comm").read_text().strip() == "qbittorrent-nox" for line in path.read_text().splitlines() if line.startswith("Uid:")))')
            [[ "$actual_uid" == "$expected_uid" ]] || { echo "Unexpected UID: $actual_uid" >&2; exit 1; }
            echo "Verified $mode login and UID $actual_uid"
          done
      - name: Report optional smoke test failure
        if: steps.smoke.outcome == 'failure'
        run: |
          echo '::warning::Optional WebUI smoke test failed. Image build and push succeeded; see the smoke test logs before deployment.'
          echo '### Optional WebUI smoke test failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Image build and push succeeded. Check the smoke test logs; this test does not block release publication.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish repository release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          gh release view "release-$VERSION" --repo c0re100/qBittorrent-Enhanced-Edition \
            --json body,url --jq '"Upstream: " + .url + "\n\n" + (.body // "")' > "$RUNNER_TEMP/notes.md"
          printf '\n\nDocker image: `czyt/qbittorrentee:%s`\nBuild: `czyt/qbittorrentee:sha-%s`\n' "$VERSION" "$RELEASE_COMMIT" >> "$RUNNER_TEMP/notes.md"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          if ! jq -e --arg version "$VERSION" 'any(.[]; .tag_name == $version and .draft == false)' "$RUNNER_TEMP/releases.json" > /dev/null; then
            gh release create "$VERSION" --target "$RELEASE_COMMIT" \
              --title "qBittorrent Enhanced Edition $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
