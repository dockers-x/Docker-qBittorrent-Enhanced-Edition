services:
  qbittorrentee:
    image: czyt/qbittorrentee:latest
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Asia/Shanghai
      - WEBUIPORT=8080
      - ENABLE_CONFIG_PERM_FIX=true
      - ENABLE_DOWNLOADS_PERM_FIX=false
    volumes:
      - type: bind
        source: ./qbittorrentee/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ./qbittorrentee/downloads
        target: /downloads
        bind:
          create_host_path: false
    ports:
      - 6881:6881
      - 6881:6881/udp
      - 8080:8080
    restart: unless-stopped
